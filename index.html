        // Módulo de Pizarra Táctica Dibujable (Canvas)
        function InteractiveBoard() {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [tool, setTool] = useState('pen'); // 'pen', 'arrow', 'clear'
            const [color, setColor] = useState('#ffffff');
            const [startPos, setStartPos] = useState({ x: 0, y: 0 });

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                drawPitchBackground(ctx, canvas.width, canvas.height);
            }, []);

            const drawPitchBackground = (ctx, w, h) => {
                ctx.fillStyle = '#15803d';
                ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 2;

                ctx.strokeRect(10, 10, w - 20, h - 20);
                ctx.beginPath();
                ctx.moveTo(w / 2, 10);
                ctx.lineTo(w / 2, h - 10);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(w / 2, h / 2, 40, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeRect(10, h / 4, 50, h / 2);
                ctx.strokeRect(w - 60, h / 4, 50, h / 2);
            };

            const startDraw = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                setIsDrawing(true);
                setStartPos({ x, y });
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;

                if (tool === 'pen') {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(startPos.x, startPos.y);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    setStartPos({ x, y });
                }
            };

            const endDraw = (e) => {
                if (!isDrawing) return;
                if (tool === 'arrow') {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    const rect = canvas.getBoundingClientRect();
                    const x = (e.changedTouches ? e.changedTouches[0].clientX : e.clientX) - rect.left;
                    const y = (e.changedTouches ? e.changedTouches[0].clientY : e.clientY) - rect.top;

                    ctx.strokeStyle = color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(startPos.x, startPos.y);
                    ctx.lineTo(x, y);
                    ctx.stroke();

                    const angle = Math.atan2(y - startPos.y, x - startPos.x);
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - 10 * Math.cos(angle - Math.PI / 6), y - 10 * Math.sin(angle - Math.PI / 6));
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - 10 * Math.cos(angle + Math.PI / 6), y - 10 * Math.sin(angle + Math.PI / 6));
                    ctx.stroke();
                }
                setIsDrawing(false);
            };

            const clearBoard = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                drawPitchBackground(ctx, canvas.width, canvas.height);
            };

            return (
                <div className="space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2 bg-charcoal p-2 rounded-lg border border-charcoal-border">
                        <div className="flex items-center gap-2">
                            <button onClick={() => setTool('pen')} className={`px-3 py-1.5 text-xs font-bold rounded flex items-center gap-1 ${tool === 'pen' ? 'bg-pitch text-white' : 'bg-charcoal-card text-gray-300'}`}>
                                <Icon name="pen-tool" className="w-3.5 h-3.5" /> Lápiz
                            </button>
                            <button onClick={() => setTool('arrow')} className={`px-3 py-1.5 text-xs font-bold rounded flex items-center gap-1 ${tool === 'arrow' ? 'bg-pitch text-white' : 'bg-charcoal-card text-gray-300'}`}>
                                <Icon name="arrow-up-right" className="w-3.5 h-3.5" /> Flecha
                            </button>
                            <div className="flex items-center gap-1 ml-2">
                                {['#ffffff', '#4ade80', '#facc15', '#ef4444', '#3b82f6'].map(c => (
                                    <button key={c} onClick={() => setColor(c)} style={{ backgroundColor: c }} className={`w-5 h-5 rounded-full border ${color === c ? 'border-white scale-110' : 'border-transparent'}`} />
                                ))}
                            </div>
                        </div>
                        <button onClick={clearBoard} className="bg-red-900/40 hover:bg-red-800 text-red-300 px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1">
                            <Icon name="trash-2" className="w-3.5 h-3.5" /> Limpiar
                        </button>
                    </div>
                    <canvas
                        ref={canvasRef}
                        onMouseDown={startDraw}
                        onMouseMove={draw}
                        onMouseUp={endDraw}
                        onTouchStart={startDraw}
                        onTouchMove={draw}
                        onTouchEnd={endDraw}
                        className="w-full aspect-[16/9] max-h-[350px] rounded-xl border border-white/20 shadow-xl cursor-crosshair touch-none"
                    />
                </div>
            );
        }

        // Timer Module
        function SessionTimer() {
            const [seconds, setSeconds] = useState(300);
            const [isActive, setIsActive] = useState(false);

            useEffect(() => {
                let interval = null;
                if (isActive && seconds > 0) {
                    interval = setInterval(() => setSeconds(s => s - 1), 1000);
                } else if (seconds === 0) {
                    setIsActive(false);
                }
                return () => clearInterval(interval);
            }, [isActive, seconds]);

            const formatTime = (sec) => {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return (
                <div className="bg-charcoal p-4 rounded-xl border border-charcoal-border flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div className="flex items-center gap-2">
                        <Icon name="timer" className="text-pitch-light w-5 h-5" />
                        <div>
                            <span className="text-xs text-gray-400 font-semibold uppercase block">Temporizador de Bloque</span>
                            <span className="text-2xl font-black font-mono text-white tracking-widest">{formatTime(seconds)}</span>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <button onClick={() => setIsActive(!isActive)} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${isActive ? 'bg-amber-500 text-black' : 'bg-pitch text-white'}`}>
                            {isActive ? 'Pausar' : 'Iniciar'}
                        </button>
                        <button onClick={() => { setIsActive(false); setSeconds(300); }} className="bg-charcoal-card border border-charcoal-border text-gray-300 px-3 py-1.5 rounded-lg text-xs font-bold">
                            5 min
                        </button>
                        <button onClick={() => { setIsActive(false); setSeconds(600); }} className="bg-charcoal-card border border-charcoal-border text-gray-300 px-3 py-1.5 rounded-lg text-xs font-bold">
                            10 min
                        </button>
                    </div>
                </div>
            );
        }

                                    { id: 'methodology', label: 'Metodología', icon: 'git-merge' },
                                    { id: 'habits', label: 'Manual Hábitos', icon: 'book-open' },
                                    { id: 'school', label: 'Escuela DT', icon: 'graduation-cap' },
                                    { id: 'sessions', label: 'Sesiones Listas', icon: 'layers' }
                                ].map((tab) => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-1.5 px-3 py-2 rounded-lg whitespace-nowrap transition-all duration-200 ${
                                            activeTab === tab.id
                                                ? 'bg-pitch text-white shadow-md shadow-pitch/30'
                                                : 'bg-charcoal-card text-gray-400 hover:text-white hover:bg-charcoal-hover'
                                        }`}
                                    >
                                        <Icon name={tab.icon} className="w-4 h-4" />
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 pt-28 pb-12">
                        
                        {activeTab === 'planner' && (
                            <div className="space-y-6">
                                <div className="bg-charcoal-card border border-charcoal-border rounded-xl p-4 sm:p-6 shadow-xl no-print">
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2 mb-4">
                                        <Icon name="sliders" className="text-pitch-light" />
                                        Generador Inteligente de Tareas Tácticas
                                    </h2>
                                    <form onSubmit={handleGenerate} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-xs font-medium text-gray-400 mb-1">Tipo de Ciclo</label>
                                            <select value={cycleType} onChange={(e) => setCycleType(e.target.value)} className="w-full bg-charcoal border border-charcoal-border rounded-lg px-3 py-2 text-sm text-white">
                                                <option>Sesión Única</option>
                                                <option>Microciclo (Semanal)</option>
                                                <option>Mesociclo (Mensual)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-gray-400 mb-1">Categoría</label>
                                            <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full bg-charcoal border border-charcoal-border rounded-lg px-3 py-2 text-sm text-white">
                                                <option>Infantiles</option>
                                                <option>Juveniles</option>
                                                <option>Amateur</option>
                                                <option>Primera</option>
                                                <option>Arqueros</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-gray-400 mb-1">Foco Principal</label>
                                            <select value={focus} onChange={(e) => setFocus(e.target.value)} className="w-full bg-charcoal border border-charcoal-border rounded-lg px-3 py-2 text-sm text-white">
                                                <option>Táctico</option>
                                                <option>Físico-Técnico</option>
                                                <option>Duelos 1v1 / Transiciones</option>
                                                <option>Perfilación y Hábitos Posicionales</option>
                                            </select>
                                        </div>
                                        <div className="md:col-span-3">
                                            <label className="block text-xs font-medium text-gray-400 mb-1">Concepto Específico o Consigna Libre</label>
                                            <input 
                                                type="text" 
                                                placeholder="Ej. Laterales recibiendo perfilados a 45° con salida rápida"
                                                value={customConcept}
                                                onChange={(e) => setCustomConcept(e.target.value)}
                                                className="w-full bg-charcoal border border-charcoal-border rounded-lg px-3 py-2 text-sm text-white"
                                            />
                                        </div>
                                        <div className="md:col-span-3 flex justify-end">
                                            <button type="submit" className="w-full sm:w-auto bg-pitch hover:bg-pitch-dark text-white font-bold py-2.5 px-6 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-pitch/20 text-sm">
                                                <Icon name="sparkles" className="w-4 h-4" /> Diseñar Rutina Personalizada
                                            </button>
                                        </div>
                                    </form>
                                </div>

                                {generatedDrill && (
                                    <div className="bg-charcoal-card border border-charcoal-border rounded-xl p-4 sm:p-6 shadow-xl print-card space-y-6">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-charcoal-border pb-4 gap-2">
                                            <div>
                                                <span className="text-xs font-bold text-pitch-accent uppercase tracking-wider">{generatedDrill.category} • {generatedDrill.focus}</span>
                                                <h1 className="text-xl sm:text-2xl font-black text-white">{generatedDrill.title}</h1>
                                            </div>
                                            <div className="flex items-center gap-2 no-print">
                                                <button onClick={() => setShowModal(true)} className="bg-charcoal border border-charcoal-border hover:bg-charcoal-hover text-gray-200 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                                                    <Icon name="file-text" className="w-4 h-4 text-pitch-light" /> Ficha Técnica
                                                </button>
                                                <button onClick={printFicha} className="bg-pitch hover:bg-pitch-dark text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-md">
                                                    <Icon name="printer" className="w-4 h-4" /> Imprimir
                                                </button>
                                            </div>
                                        </div>

                                        <SessionTimer />

                                        {/* Pitch and Image split */}
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                                            <div className="lg:col-span-2 space-y-2">
                                                <div className="flex items-center justify-between no-print">
                                                    <h3 className="text-sm font-bold text-gray-300 flex items-center gap-2">
                                                        <Icon name="map" className="text-pitch-light" /> Esquema Táctico 2D Interactivo
                                                    </h3>
                                                    <button onClick={toggleSimulation} className={`px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 transition-all ${isSimulating ? 'bg-amber-500 text-black' : 'bg-pitch/20 text-pitch-light border border-pitch/30'}`}>
                                                        <Icon name={isSimulating ? "pause" : "play"} className="w-3.5 h-3.5" />
                                                        {isSimulating ? 'Pausar' : 'Simular Jugada'}
                                                    </button>
                                                </div>

                                                <div className="relative w-full aspect-[16/9] max-h-[350px] pitch-pattern border-2 border-white/30 rounded-xl overflow-hidden shadow-2xl flex items-center justify-center">
                                                    <div className="absolute inset-2 border border-white/40 rounded"></div>
                                                    <div className="absolute left-1/2 top-2 bottom-2 w-0 border-r border-white/40"></div>
                                                    <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 border border-white/40 rounded-full"></div>

                                                    {generatedDrill.fieldData.positions.map((pos) => {
                                                        let animStyle = {};
                                                        if (isSimulating) {
                                                            if (pos.type === 'attacker') animStyle = { transform: 'translate(40px, -20px)', transition: 'transform 2s ease-in-out infinite alternate' };
                                                            else if (pos.type === 'defender') animStyle = { transform: 'translate(-30px, 15px)', transition: 'transform 2s ease-in-out infinite alternate' };
                                                            else if (pos.type === 'ball') animStyle = { transform: 'translate(120px, 10px)', transition: 'transform 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate' };
                                                        }
                                                        return (
                                                            <div key={pos.id} style={{ left: `${pos.x}%`, top: `${pos.y}%`, ...animStyle }} className={`absolute -translate-x-1/2 -translate-y-1/2 font-bold text-[10px] rounded-full flex items-center justify-center shadow-lg ${pos.type === 'attacker' ? 'w-6 h-6 bg-blue-600 text-white' : pos.type === 'defender' ? 'w-6 h-6 bg-red-600 text-white' : pos.type === 'joker' ? 'w-6 h-6 bg-yellow-400 text-black' : 'w-4 h-4 bg-white border border-black'}`}>
                                                                {pos.type === 'ball' ? '⚽' : pos.label}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                            {/* Reference Image */}
                                            <div className="space-y-2">
                                                <h3 className="text-sm font-bold text-gray-300 flex items-center gap-2">
                                                    <Icon name="image" className="text-pitch-light" /> Imagen de Referencia de Campo
                                                </h3>
                                                <div 
                                                    onClick={() => setSelectedImage(generatedDrill.imageUrl)}
                                                    className="relative aspect-[16/9] lg:aspect-auto lg:h-[350px] rounded-xl overflow-hidden border border-charcoal-border cursor-pointer group shadow-xl"
                                                >
                                                    <img src={generatedDrill.imageUrl} alt="Ejercicio" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                                                    <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-xs font-bold text-white">
                                                        Ampliar Imagen
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Canvas Drawing Board */}
                                        <div className="space-y-2 pt-2 border-t border-charcoal-border">
                                            <h3 className="text-sm font-bold text-gray-300 flex items-center gap-2">
                                                <Icon name="pen-tool" className="text-pitch-light" /> Pizarra Táctica Libre (Dibujar con Dedo/Mouse)
                                            </h3>
                                            <InteractiveBoard />
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs sm:text-sm">
                                            <div className="bg-charcoal p-3.5 rounded-lg border border-charcoal-border">
                                                <span className="font-bold text-pitch-light uppercase block text-[11px] mb-1">1. Calentamiento (12-15m)</span>
                                                <p className="text-gray-300">{generatedDrill.warmup}</p>
                                            </div>
                                            <div className="bg-charcoal p-3.5 rounded-lg border border-charcoal-border">
                                                <span className="font-bold text-pitch-light uppercase block text-[11px] mb-1">2. Tarea Principal</span>
                                                <p className="text-gray-300">{generatedDrill.mainTask}</p>
                                            </div>
                                            <div className="bg-charcoal p-3.5 rounded-lg border border-charcoal-border">
                                                <span className="font-bold text-pitch-light uppercase block text-[11px] mb-1">3. Juego Aplicativo</span>
                                                <p className="text-gray-300">{generatedDrill.applicationGame}</p>
                                            </div>
                                        </div>

                                        <div className="bg-charcoal/80 border-l-4 border-pitch p-4 rounded-r-lg space-y-2">
                                            <h4 className="text-xs font-bold uppercase text-pitch-light tracking-wide flex items-center gap-1.5">
                                                <Icon name="help-circle" className="w-4 h-4" /> Preguntas de Descubrimiento Guiado
                                            </h4>
                                            <ul className="list-disc list-inside text-xs sm:text-sm text-gray-300 space-y-1">
                                                {generatedDrill.guidedQuestions.map((q, idx) => (
                                                    <li key={idx} className="italic">"{q}"</li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'defensive' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-charcoal-card via-charcoal to-charcoal-card border border-charcoal-border rounded-xl p-4 sm:p-6 shadow-xl">
                                    <h2 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                                        <Icon name="shield-alert" className="text-pitch-light" />
                                        Estadísticas de Concientización Defensiva
                                    </h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
                                        <div className="bg-charcoal p-4 rounded-lg border border-charcoal-border flex items-center gap-4">
                                            <div className="text-3xl font-black text-pitch-light">50%</div>
                                            <p className="text-xs text-gray-300">Del partido el equipo no tiene la pelota. Saber defender sin cometer falta es clave.</p>
                                        </div>
                                        <div className="bg-charcoal p-4 rounded-lg border border-charcoal-border flex items-center gap-4">
                                            <div className="text-3xl font-black text-pitch-light">95%</div>
                                            <p className="text-xs text-gray-300">Del tiempo el jugador corre sin balón. La postura y los perfilamientos evitan situaciones de gol.</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-charcoal-card border border-charcoal-border rounded-xl p-5 shadow-lg space-y-3">
                                        <h3 className="font-bold text-pitch-light text-base flex items-center gap-2">
                                            <Icon name="user-check" /> 1. Contención Frontal (4 Pasos)
                                        </h3>
                                        <ol className="space-y-2 text-xs sm:text-sm text-gray-300 list-decimal list-inside">
                                            <li><strong className="text-white">Aproximación:</strong> Carrera rápida desacelerada hacia el rival.</li>
                                            <li><strong className="text-white">Freno Diagonal:</strong> Detenerse a ~1m en perfil semi-perpendicular.</li>
                                            <li><strong className="text-white">Contención Activa:</strong> Centro de gravedad bajo sin tirarse al suelo.</li>
                                            <li><strong className="text-white">Amague:</strong> Fintas para forzar el error del rival.</li>
                                        </ol>
                                    </div>

                                    <div className="bg-charcoal-card border border-charcoal-border rounded-xl p-5 shadow-lg space-y-3">
                                        <h3 className="font-bold text-pitch-light text-base flex items-center gap-2">
                                            <Icon name="user-x" /> 2. Contención de Espaldas
                                        </h3>
                                        <ul className="space-y-2 text-xs sm:text-sm text-gray-300 list-disc list-inside">
                                            <li><strong className="text-white">No anticipar compulsivamente:</strong> Evitar faltas innecesarias.</li>
                                            <li><strong className="text-white">Apoyo del antebrazo:</strong> Usarlo en la espalda del rival para medir distancias.</li>
                                            <li><strong className="text-white">Bloqueo de giro:</strong> Piernas firmes cerrando el perfil interno.</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'methodology' && (
                            <div className="bg-charcoal-card border border-charcoal-border rounded-xl p-5 shadow-xl space-y-4">
                                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                    <Icon name="git-merge" className="text-pitch-light" />
                                    Progresión Pedagógica de Campo
                                </h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {[
                                        { step: '01', title: 'Trabajo Analítico', desc: 'Aislamiento rígido del gesto sin oposición.' },
                                        { step: '02', title: 'Trabajo General', desc: 'Gesto aplicado en juegos reducidos sin puestos fijos.' },
                                        { step: '03', title: 'Trabajo Específico', desc: 'Inclusión de zonas, roles y oposición real.' },
                                        { step: '04', title: 'Trabajo Posicional', desc: 'Aplicación en el sistema real de juego.' }
                                    ].map((m) => (
                                        <div key={m.step} className="bg-charcoal p-4 rounded-xl border border-charcoal-border">
                                            <span className="text-2xl font-black text-pitch-light/40 block mb-1">{m.step}</span>
                                            <h3 className="font-bold text-white text-sm">{m.title}</h3>
                                            <p className="text-xs text-gray-400 mt-2">{m.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'habits' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {POSITIONAL_HABITS.map((item, idx) => (
                                    <div key={idx} className="bg-charcoal-card border border-charcoal-border rounded-xl overflow-hidden shadow-lg flex flex-col justify-between">
                                        <div className="h-32 relative overflow-hidden">
                                            <img src={item.imageUrl} alt={item.position} className="w-full h-full object-cover" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-charcoal-card to-transparent"></div>
                                            <h3 className="absolute bottom-2 left-4 font-bold text-white flex items-center gap-2 text-base">
                                                <Icon name={item.icon} className="text-pitch-light" /> {item.position}
                                            </h3>
                                        </div>
                                        <div className="p-4 space-y-2">
                                            <ul className="space-y-1.5 text-xs text-gray-300">
                                                {item.habits.map((h, i) => (
                                                    <li key={i} className="flex items-start gap-1.5">
                                                        <span className="text-pitch-light font-bold">•</span>
                                                        <span>{h}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                        <div className="p-4 pt-0">
                                            <button 
                                                onClick={() => {
                                                    setFocus('Perfilación y Hábitos Posicionales');
                                                    setCustomConcept(`Hábitos posicionales para ${item.position}`);
                                                    setActiveTab('planner');
                                                }}
                                                className="w-full bg-charcoal border border-charcoal-border hover:bg-pitch hover:text-white text-gray-300 py-2 rounded-lg text-xs font-semibold transition-colors flex items-center justify-center gap-1"
                                            >
                                                <Icon name="plus-circle" className="w-3.5 h-3.5" /> Cargar en Generador
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'school' && (
                            <div className="space-y-6">
                                <div className="bg-charcoal-card border border-charcoal-border rounded-xl p-5 shadow-xl space-y-4">
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                        <Icon name="graduation-cap" className="text-pitch-light" /> Mando Directo vs. Descubrimiento Guiado
                                    </h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs sm:text-sm">
                                        <div className="bg-charcoal p-4 rounded-lg border border-charcoal-border space-y-2">
                                            <h3 className="font-bold text-red-400 uppercase text-xs">Mando Directo</h3>
                                            <p className="text-gray-300">El DT da la respuesta masticada. Baja comprensión táctica a largo plazo.</p>
                                        </div>
                                        <div className="bg-charcoal p-4 rounded-lg border border-pitch/40 space-y-2">
                                            <h3 className="font-bold text-pitch-light uppercase text-xs">Descubrimiento Guiado</h3>
                                            <p className="text-gray-300">El DT realiza preguntas para estimular la toma de decisiones autónoma.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'sessions' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {PRESET_DRILLS.map((session, idx) => (
                                    <div key={session.id} className="bg-charcoal-card border border-charcoal-border rounded-xl overflow-hidden shadow-lg flex flex-col justify-between">
                                        <div className="h-36 relative overflow-hidden">
                                            <img src={session.imageUrl} alt={session.title} className="w-full h-full object-cover" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-charcoal-card to-transparent"></div>
                                            <span className="absolute top-2 left-2 bg-pitch text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">
                                                Sesión 0{idx + 1}
                                            </span>
                                        </div>
                                        <div className="p-4 space-y-2">
                                            <h3 className="font-bold text-white text-sm">{session.title}</h3>
                                            <p className="text-xs text-gray-400"><strong>Foco:</strong> {session.focus}</p>
                                        </div>
                                        <div className="p-4 pt-0">
                                            <button onClick={() => loadPresetSession(session)} className="w-full bg-pitch hover:bg-pitch-dark text-white py-2 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1 shadow-md">
                                                <Icon name="arrow-right-circle" className="w-4 h-4" /> Cargar Sesión
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                    </main>

                    {/* Image View Modal */}
                    {selectedImage && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 no-print" onClick={() => setSelectedImage(null)}>
                            <div className="relative max-w-4xl w-full">
                                <img src={selectedImage} alt="Ampliación" className="w-full h-auto rounded-xl border border-white/20" />
                                <button onClick={() => setSelectedImage(null)} className="absolute top-2 right-2 bg-charcoal text-white p-2 rounded-full">
                                    <Icon name="x" />
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Ficha Técnica Modal */}
                    {showModal && generatedDrill && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-charcoal-card border border-charcoal-border w-full max-w-lg rounded-xl p-6 space-y-4 shadow-2xl">
                                <div className="flex items-center justify-between border-b border-charcoal-border pb-3">
                                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                                        <Icon name="file-text" className="text-pitch-light" /> Ficha Técnica Completa
                                    </h3>
                                    <button onClick={() => setShowModal(false)} className="text-gray-400 hover:text-white"><Icon name="x" /></button>
                                </div>
                                <div className="space-y-3 text-xs sm:text-sm text-gray-300">
                                    <p><strong className="text-white">Dimensiones:</strong> {generatedDrill.fieldData.dimensions}</p>
                                    <p><strong className="text-white">Jugadores:</strong> {generatedDrill.fieldData.players}</p>
                                    <p><strong className="text-white">Materiales:</strong> {generatedDrill.fieldData.materials}</p>
                                    <p><strong className="text-white">Variantes:</strong> {generatedDrill.fieldData.variations}</p>
                                </div>
                                <div className="pt-2 flex justify-end">
                                    <button onClick={() => setShowModal(false)} className="bg-pitch text-white px-4 py-2 rounded-lg text-xs font-bold">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="mt-auto py-4 border-t border-charcoal-border text-center text-xs text-gray-500 no-print">
                        TactixPro © 2026 - Plataforma de Formación e Inteligencia Táctica para Entrenadores.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
